name: Feature request
description: 提出功能建议
title: '[feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是直接给出实现
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及领域
      options:
        - 资产与探测
        - 凭据与密钥
        - 终端
        - Agent / API
        - 安装与升级
        - UI / 设计
        - 文档
        - 其他
    validations:
      required: true
