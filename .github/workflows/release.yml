name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y openssh-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @boerfen/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Package release tree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "boerfen-assets-${VERSION}.tar.gz" \
            --exclude='.git' --exclude='node_modules' --exclude='data' --exclude='.e2e-data' \
            apps packages skills scripts docs Dockerfile docker-compose.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml README.md LICENSE \
            CHANGELOG.md SECURITY.md llms.txt .env.example
          sha256sum "boerfen-assets-${VERSION}.tar.gz" > SHA256SUMS
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boerfen-assets-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
