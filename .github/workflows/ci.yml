name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsvault
          POSTGRES_PASSWORD: opsvault
          POSTGRES_DB: opsvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsvault -d opsvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y openssh-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opsvault/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
        env:
          TEST_POSTGRES_URL: postgres://opsvault:opsvault@127.0.0.1:5432/opsvault_test
      - run: pnpm -r build
      - run: docker build .
