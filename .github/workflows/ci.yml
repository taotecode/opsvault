name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boerfen
          POSTGRES_PASSWORD: boerfen
          POSTGRES_DB: boerfen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U boerfen -d boerfen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y openssh-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @boerfen/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
        env:
          TEST_POSTGRES_URL: postgres://boerfen:boerfen@127.0.0.1:5432/boerfen_test
      - run: pnpm -r build
      - run: docker build .
