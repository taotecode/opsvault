services:
  app:
    build: .
    image: ${BOERFEN_IMAGE:-boerfen-assets:local}
    ports:
      - '${PORT:-8080}:8080'
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATA_DIR: /app/data
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      MASTER_KEY: ${MASTER_KEY:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INSTALL_LOCK: ${INSTALL_LOCK:-false}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      REVEAL_WINDOW_MINUTES: ${REVEAL_WINDOW_MINUTES:-5}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - boerfen-data:/app/data
    restart: unless-stopped

  pg:
    image: postgres:16-alpine
    profiles: ['pg']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boerfen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-boerfen}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - boerfen-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-boerfen} -d ${POSTGRES_DB:-boerfen}']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  boerfen-data:
  boerfen-pg-data:
